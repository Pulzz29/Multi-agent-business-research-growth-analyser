[pytest]
testpaths = tests
addopts = -p no:cacheprovider -m "not e2e and not e2e_live"
markers =
    e2e: real-browser tests against the running backend and frontend (opt-in: pytest -m e2e tests/e2e)
    e2e_live: live Azure research through the browser; consumes Azure tokens (opt-in: pytest -m e2e_live tests/e2e)
