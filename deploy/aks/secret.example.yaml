# TEMPLATE ONLY - never commit real values. Prefer creating the Secret from
# your secret store (for example the Azure Key Vault CSI driver) instead:
#   kubectl -n insightiq create secret generic insightiq-secrets --from-env-file=<file outside Git>
apiVersion: v1
kind: Secret
metadata:
  name: insightiq-secrets
  namespace: insightiq
type: Opaque
stringData:
  DB_HOST: "<database host name>"
  DB_PORT: "5432"
  DB_NAME: "<database name>"
  DB_USER: "<database login>"
  DB_PASSWORD: "<database password>"
  # Server-to-server only (scripts, automation); users sign in with email and
  # password and never enter this key.
  API_ACCESS_KEY: "<long random access key>"
  AZURE_OPENAI_API_KEY: "<key>"
  AZURE_OPENAI_ENDPOINT: "https://<resource>.openai.azure.com/openai/v1/"
  LLM_MODEL: "<deployment name>"
  NEWSDATA_API_KEY: "<key>"
  FINNHUB_API_KEY: "<key>"
  FMP_API_KEY: "<key>"
  SEC_USER_AGENT: "InsightIQ research <contact email>"
  GROQ_API_KEY: ""
  GROQ_MODEL: ""
  # Optional: export telemetry to Azure Monitor / Application Insights (also
  # needs the azure-monitor-opentelemetry-exporter package in the image).
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""
