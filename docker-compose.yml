# Local container stack: PostgreSQL 16 + API + web UI.
#   docker compose --env-file .env up --build
# Uses the provider/AI keys from .env; the database runs in its own volume
# (separate from your pgAdmin-managed local server). UI: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightiq
      POSTGRES_USER: insightiq
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightiq -d insightiq"]
      interval: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_BACKEND: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: insightiq
      DB_USER: insightiq
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-change-me-local-only}
      DB_SSLMODE: disable
      DB_ALLOW_INSECURE_REMOTE: "true"   # private compose network only
      TRUSTED_PROXY_IPS: "*"             # only the web container can reach the API here
      API_ACCESS_KEY: ${API_ACCESS_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      LLM_MODEL: ${LLM_MODEL:-${AZURE_OPENAI_DEPLOYMENT:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT}
    expose:
      - "8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:8080"

volumes:
  pgdata:
